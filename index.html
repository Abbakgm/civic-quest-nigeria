<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Civic Quest: Nigeria</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #063b25, #0b6b3a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 430px;
        }

        .card {
            background: rgba(255,255,255,0.13);
            padding: 25px;
            border-radius: 22px;
            backdrop-filter: blur(8px);
        }

        #homeScreen,
        #resultScreen {
            text-align: center;
        }

        .flag {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .tagline {
            color: #d9f5e5;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 5px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .start {
            background: white;
            color: #075c32;
        }

        .secondary {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        #gameScreen,
        #resultScreen {
            display: none;
        }

        .topBar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .missionTitle {
            margin-bottom: 15px;
        }

        .question {
            background: rgba(0,0,0,0.15);
            padding: 18px;
            border-radius: 15px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .answer {
            background: white;
            color: #222;
        }

        .answer:disabled {
            opacity: 0.6;
        }

        #feedback {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.18);
            line-height: 1.5;
        }

        #nextBtn {
            display: none;
            background: #ffd700;
            color: #164b2e;
        }

        .resultScore {
            font-size: 42px;
            font-weight: bold;
            margin: 20px 0 10px;
        }

        .level {
            font-size: 24px;
            margin: 15px 0;
        }

        .playerName {
            color: #d9f5e5;
        }
        #missionMap {
    display: none;
}

#missionMap button {
    text-align: left;
}
    </style>
</head>

<body>

<div class="container">

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="card">

        <div class="flag">🇳🇬</div>

        <h1>Civic Quest: Nigeria</h1>

        <p class="tagline">
            Learn • Decide • Build Nigeria
        </p>

        <input
            type="text"
            id="playerName"
            placeholder="Enter your name"
            maxlength="20"
        >

        <button class="start" onclick="startGame()">
            🎮 START GAME
        </button>

        <button class="secondary" onclick="showMissionMap()">
    🗺️ MISSIONS
</button>

        <button class="secondary">
            🏆 LEADERBOARD
        </button>

    </div>
<!-- MISSION MAP -->
<div id="missionMap" class="card">

    <div style="text-align:center;">
        <div class="flag">🗺️</div>

        <h1>Mission Map</h1>

        <p class="tagline">
            Complete the missions and become a Civic Champion!
        </p>
    </div>

    <button class="secondary" onclick="openMission(0)">
        🗳️ Mission 1 — The Election
    </button>

    <button class="secondary" onclick="openMission(1)">
        🚰 Mission 2 — The Water Problem
    </button>

    <button class="secondary" onclick="openMission(2)">
        🌳 Mission 3 — Protect Our Environment
    </button>

    <button class="secondary" onclick="openMission(3)">
        🏛️ Mission 4 — Know Your Government
    </button>

    <button class="secondary" onclick="openMission(4)">
        🤝 Mission 5 — Build the Community
    </button>

    <button class="start" onclick="backHome()">
        ⬅️ BACK HOME
    </button>

</div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="card">

        <div class="topBar">
            <span id="missionNumber">MISSION 1 OF 5</span>
            <span>🏆 <span id="score">0</span></span>
        </div>

        <div class="topBar">
            <span id="missionIcon">🗳️</span>
            <span>⏱️ <span id="timer">20</span>s</span>
        </div>

        <div class="missionTitle">
            <h2 id="missionTitle">The Election</h2>
        </div>

        <div class="question">

            <p id="questionText"></p>

            <br>

            <strong id="questionPrompt"></strong>

        </div>

        <div id="answers"></div>

        <div id="feedback"></div>

        <button id="nextBtn" onclick="nextMission()">
            NEXT MISSION ➡️
        </button>

    </div>


    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="card">

        <div class="flag">🏆</div>

        <h1>Mission Complete!</h1>

        <p class="playerName">
            Player: <strong id="finalName"></strong>
        </p>

        <div class="resultScore">
            <span id="finalScore">0</span>
        </div>

        <p>Civic Points</p>

        <div class="level" id="civicLevel">
            ⭐ Beginner Citizen
        </div>

        <p id="finalMessage"></p>

        <button class="start" onclick="restartGame()">
            🔄 PLAY AGAIN
        </button>

    </div>

</div>


<script>

const missions = [ {
    number: 5,
    icon: "🤝",
    title: "Build the Community",

    story:
    "Your community receives a limited budget to improve people's lives. You can only choose one major project.",

    prompt:
    "Which project should be prioritized?",

    answers: [
        "A. Buy luxury items for a few people",
        "B. Build a clean-water project 🚰",
        "C. Waste the money",
        "D. Ignore the community's needs"
    ],

    correct: 1,

    feedback:
    "Excellent choice! Access to clean water can improve health and the quality of life for many people in the community."
},{
    number: 4,
    icon: "🏛️",
    title: "Know Your Government",

    story:
    "Your community has a serious problem with a public service.",

    prompt:
    "What is the most responsible action?",

    answers: [
        "A. Destroy government property",
        "B. Ignore the problem",
        "C. Identify the responsible authority and report the problem through the proper channel",
        "D. Spread false information online"
    ],

    correct: 2,

    feedback:
    "Responsible citizens should understand how government works and use the proper channels to report community problems."
},

    {
        number: 1,
        icon: "🗳️",
        title: "The Election",

        story:
        "You discover that someone is trying to influence voters in your community by offering them money.",

        prompt:
        "What should a responsible citizen do?",

        answers: [
            "A. Accept the money",
            "B. Ignore the situation",
            "C. Reject it and report it properly",
            "D. Fight the person"
        ],

        correct: 2,

        feedback:
        "A responsible citizen should reject vote buying and report the situation through lawful channels."
    },

    {
        number: 2,
        icon: "🚰",
        title: "The Water Problem",

        story:
        "The water supply in your community has stopped working, and many families are struggling to get clean water.",

        prompt:
        "What is the most responsible action?",

        answers: [
            "A. Destroy public property",
            "B. Report the problem to the appropriate authority",
            "C. Ignore the problem",
            "D. Spread false information online"
        ],

        correct: 1,

        feedback:
        "Good civic action means reporting community problems through the proper channels and working peacefully toward a solution."
    },

    {
        number: 3,
        icon: "🌳",
        title: "Protect Our Environment",

        story:
        "People are dumping waste in an open area near your community.",

        prompt:
        "What should a responsible citizen do?",

        answers: [
            "A. Join them",
            "B. Ignore the problem",
            "C. Encourage proper waste disposal and report the problem",
            "D. Burn all the waste"
        ],

        correct: 2,

        feedback:
        "Protecting the environment is everyone's responsibility. Encourage proper waste disposal and report serious environmental problems."
    }

];


let currentMission = 0;
let score = 0;
let timeLeft = 20;
let timerInterval;
let answered = false;
let playerName = "";


function startGame()document.getElementById("missionMap").style.display = "none"; {

    const nameInput =
        document.getElementById("playerName");

    playerName =
        nameInput.value.trim();

    if (playerName === "") {

        alert("Please enter your name first.");

        return;

    }

    currentMission = 0;

    score = 0;

    document.getElementById("score").textContent = score;

    document.getElementById("homeScreen").style.display =
        "none";

    document.getElementById("resultScreen").style.display =
        "none";

    document.getElementById("gameScreen").style.display =
        "block";

    showMission();

}


function showMission() {

    clearInterval(timerInterval);

    answered = false;

    const mission = missions[currentMission];

    document.getElementById("missionNumber").textContent =
        "MISSION " + mission.number + " OF 5";

    document.getElementById("missionIcon").textContent =
        mission.icon;

    document.getElementById("missionTitle").textContent =
        mission.title;

    document.getElementById("questionText").textContent =
        mission.story;

    document.getElementById("questionPrompt").textContent =
        mission.prompt;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";

    mission.answers.forEach(function(answer, index) {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {

            checkAnswer(index);

        };

        answersContainer.appendChild(button);

    });

    document.getElementById("feedback").style.display =
        "none";

    document.getElementById("nextBtn").style.display =
        "none";

    startTimer();

}


function startTimer() {

    timeLeft = 20;

    document.getElementById("timer").textContent =
        timeLeft;

    timerInterval = setInterval(function() {

        timeLeft--;

        document.getElementById("timer").textContent =
            timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            if (!answered) {

                answered = true;

                showFeedback(
                    "⏰ Time's up!<br><br>" +
                    "🤖 <strong>AI Civic Coach:</strong> " +
                    "Think carefully about the most peaceful " +
                    "and responsible action."
                );

                disableAnswers();

                document.getElementById("nextBtn").style.display =
                    "block";
            }

        }

    }, 1000);

}


function checkAnswer(selectedIndex) {

    if (answered) return;

    answered = true;

    clearInterval(timerInterval);

    const mission = missions[currentMission];

    if (selectedIndex === mission.correct) {

        score += 50;

        document.getElementById("score").textContent =
            score;

        showFeedback(
            "✅ Excellent decision!<br><br>" +
            "🤖 <strong>AI Civic Coach:</strong> " +
            mission.feedback +
            "<br><br>" +
            "🏆 +50 Civic Points"
        );

    } else {

        showFeedback(
            "❌ Not the best choice.<br><br>" +
            "🤖 <strong>AI Civic Coach:</strong> " +
            mission.feedback
        );

    }

    disableAnswers();

    document.getElementById("nextBtn").style.display =
        "block";

}


function showFeedback(message) {

    const feedback =
        document.getElementById("feedback");

    feedback.innerHTML = message;

    feedback.style.display = "block";

}


function disableAnswers() {

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(function(button) {

        button.disabled = true;

    });

}


function nextMission() {

    currentMission++;

    if (currentMission < missions.length) {

        showMission();

    } else {

        showResults();

    }

}


function showResults() {

    clearInterval(timerInterval);

    document.getElementById("gameScreen").style.display =
        "none";

    document.getElementById("resultScreen").style.display =
        "block";

    document.getElementById("finalName").textContent =
        playerName;

    document.getElementById("finalScore").textContent =
        score;

    let level = "";

    if (score >= 150) {

        level = "🏆 Civic Champion";

    } else if (score >= 100) {

        level = "⭐ Active Citizen";

    } else {

        level = "🌱 Beginner Citizen";

    }

    document.getElementById("civicLevel").textContent =
        level;

    document.getElementById("finalMessage").textContent =
        "Keep learning, making responsible decisions, and helping your community.";

}


function restartGame() {

    document.getElementById("resultScreen").style.display =
        "none";

    document.getElementById("homeScreen").style.display =
        "block";

    document.getElementById("playerName").value =
        "";

}
<script>

// sauran JavaScript ɗinka a nan...

function showMissionMap() {

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("missionMap").style.display = "block";

}

function openMission(index) {

    currentMission = index;

    document.getElementById("missionMap").style.display = "none";
    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    showMission();

}

function backHome() {

    clearInterval(timerInterval);

    document.getElementById("missionMap").style.display = "none";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";

}

</script>
</script>

</body>
</html>
