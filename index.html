<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Civic Quest: Nigeria</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #063b25, #0b6b3a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 430px;
        }

        .card {
            background: rgba(255,255,255,0.13);
            padding: 25px;
            border-radius: 22px;
            backdrop-filter: blur(8px);
        }

        #homeScreen {
            text-align: center;
        }

        .flag {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .tagline {
            color: #d9f5e5;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .start {
            background: white;
            color: #075c32;
        }

        .secondary {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        #gameScreen {
            display: none;
        }

        .topBar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .missionTitle {
            margin-bottom: 15px;
        }

        .question {
            background: rgba(0,0,0,0.15);
            padding: 18px;
            border-radius: 15px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .answer {
            background: white;
            color: #222;
        }

        .answer:disabled {
            opacity: 0.6;
        }

        #feedback {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.18);
            line-height: 1.5;
        }

        #nextBtn {
            display: none;
            background: #ffd700;
            color: #164b2e;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="homeScreen" class="card">

        <div class="flag">🇳🇬</div>

        <h1>Civic Quest: Nigeria</h1>

        <p class="tagline">
            Learn • Decide • Build Nigeria
        </p>

        <button class="start" onclick="startGame()">
            🎮 START GAME
        </button>

        <button class="secondary">
            🗺️ MISSIONS
        </button>

        <button class="secondary">
            🏆 LEADERBOARD
        </button>

    </div>


    <!-- GAME -->
    <div id="gameScreen" class="card">

        <div class="topBar">
            <span>MISSION 1 OF 5</span>
            <span>🏆 <span id="score">0</span></span>
        </div>

        <div class="topBar">
            <span>🗳️ Election</span>
            <span>⏱️ <span id="timer">20</span>s</span>
        </div>

        <div class="missionTitle">
            <h2>The Election</h2>
        </div>

        <div class="question">

            <p>
                You discover that someone is trying to influence
                voters in your community by offering them money.
            </p>

            <br>

            <strong>
                What should a responsible citizen do?
            </strong>

        </div>


        <button class="answer" onclick="checkAnswer(false)">
            A. Accept the money
        </button>

        <button class="answer" onclick="checkAnswer(false)">
            B. Ignore the situation
        </button>

        <button class="answer" onclick="checkAnswer(true)">
            C. Reject it and report it properly
        </button>

        <button class="answer" onclick="checkAnswer(false)">
            D. Fight the person
        </button>


        <!-- AI FEEDBACK -->
        <div id="feedback"></div>

        <button id="nextBtn" onclick="nextMission()">
            NEXT MISSION ➡️
        </button>

    </div>

</div>


<script>

let score = 0;
let timeLeft = 20;
let timerInterval;
let answered = false;


function startGame() {

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    startTimer();

}


function startTimer() {

    clearInterval(timerInterval);

    timeLeft = 20;

    document.getElementById("timer").textContent = timeLeft;

    timerInterval = setInterval(function() {

        timeLeft--;

        document.getElementById("timer").textContent = timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            if (!answered) {

                showFeedback(
                    "⏰ Time's up!<br><br>" +
                    "🤖 AI Civic Coach: Think carefully about " +
                    "peaceful and lawful ways to protect your community."
                );

                disableAnswers();

            }

        }

    }, 1000);

}


function checkAnswer(correct) {

    if (answered) return;

    answered = true;

    clearInterval(timerInterval);

    if (correct) {

        score += 50;

        document.getElementById("score").textContent = score;

        showFeedback(
            "✅ Excellent decision!<br><br>" +
            "🤖 <strong>AI Civic Coach:</strong> " +
            "A responsible citizen should reject vote buying " +
            "and report the situation through lawful channels.<br><br>" +
            "🏆 +50 Civic Points"
        );

    } else {

        showFeedback(
            "❌ Not the best choice.<br><br>" +
            "🤖 <strong>AI Civic Coach:</strong> " +
            "A responsible citizen should use peaceful and " +
            "lawful ways to protect the community."
        );

    }

    disableAnswers();

    document.getElementById("nextBtn").style.display = "block";

}


function showFeedback(message) {

    const feedback = document.getElementById("feedback");

    feedback.innerHTML = message;
    feedback.style.display = "block";

}


function disableAnswers() {

    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(function(button) {

        button.disabled = true;

    });

}


function nextMission() {

    alert(
        "🚰 Mission 2 is coming!\n\n" +
        "The Water Problem"
    );

}

</script>

</body>
</html>
